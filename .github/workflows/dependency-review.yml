# Blocks a PR that introduces a known-vulnerable or newly-yanked dependency,
# before merge (Dependabot alerts only fire after a dependency is already in).
name: "Dependency Review"

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
