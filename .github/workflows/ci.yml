# Run the test suite on every push and pull request. Tests are offline by
# design (fixtures in tests/pages), so CI never flakes on a live site.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # The store's file modes, the paths oc builds from a session name, and the
    # binary the CLI tests spawn all behave differently on Windows, so the
    # suite runs there too rather than resting on a contributor's local run.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
